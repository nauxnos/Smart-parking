<!DOCTYPE html>
<html>
<head>
    <title>Bãi đỗ xe thông minh</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.6.0/socket.io.js"></script>
</head>
<body>
    <div class="header">
        <div class="header-top">
            <h1>BÃI ĐỖ XE THÔNG MINH</h1>
            <div class="header-right">
                <div class="time-display" id="current-time"></div>
                <a href="{{ url_for('logout') }}" class="logout-btn">Đăng xuất</a>
            </div>
        </div>
        <div class="nav-container">
            <button class="nav-btn active" data-target="main-content">Dashboard</button>
            <button class="nav-btn" data-target="table-content">Table</button>
        </div>
    </div>

    <!-- Main content -->
    <div id="main-content" class="content-section active">
        <div class="container">
            <div class="cameras-container">
                <!-- Camera vào -->
                <div class="camera-box">
                    <h2>CAMERA VÀO</h2>
                    <div class="camera-view">
                        <img src="{{ url_for('video_feed', camera_id='in') }}" width="280">
                    </div>
                    <div class="plate-view">
                        <h3>Biển số xe</h3>
                        <img src="{{ url_for('captured_feed', camera_id='in') }}" width="180">
                    </div>
                    <div class="plate-input">
                        <p>Biển số: <span id="plate-number-in">Chờ phát hiện...</span></p>
                    </div>
                </div>
                
                <!-- Camera ra -->
                <div class="camera-box">
                    <h2>CAMERA RA</h2>
                    <div class="camera-view">
                        <img src="{{ url_for('video_feed', camera_id='out') }}" width="280">
                    </div>
                    <div class="plate-view">
                        <h3>Biển số xe</h3>
                        <img src="{{ url_for('captured_feed', camera_id='out') }}" width="180">
                    </div>
                    <div class="plate-input">
                        <p>Biển số: <span id="plate-number-out">Chờ phát hiện...</span></p>
                    </div>
                </div>
                
                <!-- Phần thông tin -->
                <div class="info-box">
                    <div class="vehicle-info">
                        <label>SỐ XE HIỆN TẠI:</label>
                        <input type="text" id="car-count" readonly value="0" class="green-bg">
                    </div>
                    <div class="vehicle-info">
                        <label>XE VÀO GẦN NHẤT:</label>
                        <input type="text" id="latest-in" readonly>
                    </div>
                    <div class="vehicle-info">
                        <label>XE RA GẦN NHẤT:</label>
                        <input type="text" id="latest-out" readonly>
                    </div>

                    <!-- Nút điều khiển -->
                    <div class="control-buttons">
                        <button id="barrier-in-control" class="red-btn">MỞ BARRIER VÀO</button>
                        <button id="barrier-out-control" class="red-btn">MỞ BARRIER RA</button>
                        <button id="exit-btn" class="exit-btn">THOÁT</button>
                    </div>

                    <!-- Recent logs table -->
                    <div class="recent-logs">
                        <h3>Lịch sử gần đây</h3>
                        <table id="recent-logs-table">
                            <thead>
                                <tr>
                                    <th>Biển số</th>
                                    <th>Thời gian</th>
                                    <th>Trạng thái</th>
                                </tr>
                            </thead>
                            <tbody>
                                <!-- Data will be inserted by JavaScript -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- Sơ đồ bãi đỗ xe -->
            <div class="parking-slots">
                <h3>Sơ đồ bãi đỗ xe</h3>
                <div class="slots-container">
                    <div class="slot" id="slot1">
                        <div class="car-icon">🚗</div>
                        <div class="slot-status"></div>
                        <div class="slot-label">Vị trí 1</div>
                    </div>
                    <div class="slot" id="slot2">
                        <div class="car-icon">🚗</div>
                        <div class="slot-status"></div>
                        <div class="slot-label">Vị trí 2</div>
                    </div>
                    <div class="slot" id="slot3">
                        <div class="car-icon">🚗</div>
                        <div class="slot-status"></div>
                        <div class="slot-label">Vị trí 3</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Table content -->
    <div id="table-content" class="content-section">
        <div class="table-container">
            <div class="search-box">
                <input type="text" id="search-input" placeholder="Nhập biển số xe...">
            </div>
            <table id="vehicle-table">
                <thead>
                    <tr>
                        <th>STT</th>
                        <th>Biển số</th>
                        <th>RFID</th>
                        <th>Thời gian vào</th>
                        <th>Thời gian ra</th>
                        <th>Trạng thái</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Data will be inserted here by JavaScript -->
                </tbody>
            </table>
            
            <div class="pagination">
                <button id="prev-page" class="page-btn">&laquo; Trước</button>
                <div id="page-numbers"></div>
                <button id="next-page" class="page-btn">Sau &raquo;</button>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
